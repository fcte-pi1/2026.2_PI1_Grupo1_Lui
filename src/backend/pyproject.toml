# Configuração das ferramentas de teste do backend (não é um pacote instalável).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "mysql: roda contra o MySQL de MYSQL_TEST_URL (armazena.sql aplicado)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
