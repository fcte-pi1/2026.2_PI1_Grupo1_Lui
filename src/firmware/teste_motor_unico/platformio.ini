; ==============================================================================
; PLATFORMIO CONFIGURATION - TESTE ISOLADO DE MOTOR UNICO (TB6612FNG + ENCODERS)
; Micromouse PI1 2026.2 - ESP32 DevKit V1
; ==============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_extra_dirs =
    ../lib
lib_deps =
    calibracao
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
