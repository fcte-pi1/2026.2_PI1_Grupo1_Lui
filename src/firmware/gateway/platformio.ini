[platformio]
default_envs = esp8266, esp32dev

; Gateway do PC Server oficial (ESP8266 NodeMCU / D1 mini conectado via USB)
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    telemetria
    bblanchon/ArduinoJson @ ^7.0.0

; Gateway para testes de bancada em ESP32 DevKit V1
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    telemetria
    bblanchon/ArduinoJson @ ^7.0.0

; Habilite para ver diagnosticos (pacotes descartados) na serial.
; ATENCAO: linhas de diagnostico NAO sao JSON; nao use com o backend.
;build_flags = -DGATEWAY_DEBUG

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
; Instrumentacao de cobertura (gcov) para o relatorio do gcovr no CI.
; --coverage vai so para o compilador; -lgcov completa a ligacao.
build_flags = --coverage -lgcov
lib_extra_dirs = ../lib
lib_deps =
    telemetria
    bblanchon/ArduinoJson @ ^7.0.0
