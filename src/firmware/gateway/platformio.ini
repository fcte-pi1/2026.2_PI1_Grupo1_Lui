[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    telemetria
    bblanchon/ArduinoJson @ ^7.0.0

; Habilite para ver diagnosticos (pacotes descartados) na serial.
; ATENCAO: linhas de diagnostico NAO sao JSON; nao use com o backend.
;build_flags = -DGATEWAY_DEBUG

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_extra_dirs = ../lib
lib_deps =
    telemetria
    bblanchon/ArduinoJson @ ^7.0.0
