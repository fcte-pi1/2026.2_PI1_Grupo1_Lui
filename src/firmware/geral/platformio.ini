; ==============================================================================
; PLATFORMIO CONFIGURATION - FIRMWARE GERAL UNIFICADO (BANCADA + PROVA AUTONOMA)
; Reutiliza os drivers e a logica oficial de src/firmware/robo + menu de testes.
; ==============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_extra_dirs =
    ../lib
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.11.0
    pololu/VL53L0X @ ^1.3.1
    telemetria
    calibracao
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -I ../robo/src
