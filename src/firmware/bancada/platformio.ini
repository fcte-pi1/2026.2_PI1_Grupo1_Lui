; ==============================================================================
; PLATFORMIO CONFIGURATION - FIRMWARE DE BANCADA E COMISSIONAMENTO (ESP32)
; Grupo 1 - PI1 2026.2 (Prof. Lui)
; Configuracao oficial: Ponte H TB6612, Encoders, 3x VL53L0X, Bateria 2S, ESP-NOW
; ==============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_extra_dirs =
    ../lib

lib_deps =
    pololu/VL53L0X @ ^1.3.1
    telemetria
    calibracao

build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0

; O firmware principal nao compila os testes por componente (cada um tem setup/loop)
build_src_filter = +<*> -<testes_componentes/>

; ==============================================================================
; TESTES POR COMPONENTE (src/testes_componentes/)
; Cada ambiente grava um firmware que testa um unico componente, com os demais
; em estado seguro (ponte H em standby e ToF desligados por XSHUT). A pinagem
; vem de include/pinout.h (PinosRobo.h + CalibracaoRobo.h).
;   pio run -d src/firmware/bancada -e teste_motor_esquerdo -t upload -t monitor
; ==============================================================================

[env:teste_motor_esquerdo]
extends = env:esp32dev
build_src_filter = -<*> +<testes_componentes/teste_motor.cpp>
build_flags =
    ${env:esp32dev.build_flags}
    -DTESTE_MOTOR_LADO=0

[env:teste_motor_direito]
extends = env:esp32dev
build_src_filter = -<*> +<testes_componentes/teste_motor.cpp>
build_flags =
    ${env:esp32dev.build_flags}
    -DTESTE_MOTOR_LADO=1

[env:teste_encoder_esquerdo]
extends = env:esp32dev
build_src_filter = -<*> +<testes_componentes/teste_encoder.cpp>
build_flags =
    ${env:esp32dev.build_flags}
    -DTESTE_ENCODER_LADO=0

[env:teste_encoder_direito]
extends = env:esp32dev
build_src_filter = -<*> +<testes_componentes/teste_encoder.cpp>
build_flags =
    ${env:esp32dev.build_flags}
    -DTESTE_ENCODER_LADO=1

[env:teste_tof_esquerdo]
extends = env:esp32dev
build_src_filter = -<*> +<testes_componentes/teste_tof.cpp>
build_flags =
    ${env:esp32dev.build_flags}
    -DTESTE_TOF_ALVO=1

[env:teste_tof_frontal]
extends = env:esp32dev
build_src_filter = -<*> +<testes_componentes/teste_tof.cpp>
build_flags =
    ${env:esp32dev.build_flags}
    -DTESTE_TOF_ALVO=2

[env:teste_tof_direito]
extends = env:esp32dev
build_src_filter = -<*> +<testes_componentes/teste_tof.cpp>
build_flags =
    ${env:esp32dev.build_flags}
    -DTESTE_TOF_ALVO=3

[env:teste_tof_sequencia]
extends = env:esp32dev
build_src_filter = -<*> +<testes_componentes/teste_tof_sequencia.cpp>

[env:teste_tof_mapa_xshut]
extends = env:esp32dev
build_src_filter = -<*> +<testes_componentes/teste_tof_mapa_xshut.cpp>

[env:teste_bateria]
extends = env:esp32dev
build_src_filter = -<*> +<testes_componentes/teste_bateria.cpp>
