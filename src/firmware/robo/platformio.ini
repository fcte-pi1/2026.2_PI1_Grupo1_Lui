[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.11.0
    pololu/VL53L0X @ ^1.3.1
    telemetria
    calibracao

[env:esp32dev_3tof]
extends = env:esp32dev
build_flags = -DCAL_MODO_SENSORES=0

[env:esp32dev_ultrassonico]
extends = env:esp32dev
build_flags = -DCAL_MODO_SENSORES=1

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
; Instrumentacao de cobertura (gcov) para o relatorio do gcovr no CI.
; --coverage vai so para o compilador; -lgcov completa a ligacao.
build_flags = --coverage -lgcov
lib_extra_dirs = ../lib
lib_deps =
    telemetria
    calibracao
    bblanchon/ArduinoJson @ ^7.0.0
