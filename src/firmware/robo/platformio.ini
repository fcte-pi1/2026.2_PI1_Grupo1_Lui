[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.11.0
    telemetria

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_extra_dirs = ../lib
lib_deps =
    telemetria
    bblanchon/ArduinoJson @ ^7.0.0
