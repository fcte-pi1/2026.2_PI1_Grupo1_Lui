; ==============================================================================
; PLATFORMIO CONFIGURATION - TESTE ISOLADO PONTE H + MOTORES + ENCODERS + ESP-NOW
; Micromouse PI1 2026.2 - ESP32 DevKit V1 (com gateway ESP8266 via ESP-NOW)
; ==============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_extra_dirs =
    ../lib
lib_deps =
    calibracao
    telemetria
build_src_filter = -<*> +<main.cpp>
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0

[env:pinos_alto]
extends = env:esp32dev
build_src_filter = -<*> +<pinos_alto.cpp>
