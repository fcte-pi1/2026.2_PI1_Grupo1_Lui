; ==============================================================================
; PLATFORMIO CONFIGURATION - FIRMWARE FINAL MICROMOUSE ESP32-WROOM-32D
; Grupo 1 - PI1 2026.2 (Prof. Lui)
; Pinagem Final Sem Conflitos (Ponte H, Encoders, 3x VL53L0X, Bateria, ESP-NOW)
; ==============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_extra_dirs =
    ../../src/firmware/lib

lib_deps =
    pololu/VL53L0X @ ^1.3.1
    telemetria

build_flags =
    -Wall
    -Wextra
    -std=gnu++17
