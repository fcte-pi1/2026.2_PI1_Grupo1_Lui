; ==============================================================================
; PLATFORMIO CONFIGURATION - TESTE INDIVIDUAL DE SENSOR VL53L0X (1 POR VEZ)
; Micromouse PI1 2026.2 - ESP32
; ==============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    pololu/VL53L0X @ ^1.3.1

build_flags =
    -Wall
    -Wextra
    -std=gnu++17
