name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - 'src/backend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/scripts/resumo_cobertura.py'
  pull_request:
    paths:
      - 'src/frontend/**'
      - 'src/backend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/scripts/resumo_cobertura.py'

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, testes com cobertura e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes com cobertura (Vitest)
        run: npm run test:coverage

      - name: Publicar resumo da cobertura
        run: >-
          python3 ../../.github/scripts/resumo_cobertura.py istanbul
          coverage/coverage-summary.json
          --titulo "Cobertura do frontend (Vitest)"
          >> "$GITHUB_STEP_SUMMARY"

      - name: Build (Vite)
        run: npm run build

      - name: Publicar relatório HTML da cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: src/frontend/coverage

  e2e:
    name: Testes E2E (Playwright com o simulador)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependências do backend
        run: python -m pip install -r ../backend/requirements.txt

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        run: npm run test:e2e
        env:
          E2E_PYTHON: python

      - name: Publicar relatório HTML do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: src/frontend/playwright-report
