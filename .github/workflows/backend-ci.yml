name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Testes com cobertura (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes com cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-report=html

      - name: Publicar resumo da cobertura
        run: |
          {
            echo "### Cobertura do backend (pytest-cov)"
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório HTML da cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: src/backend/htmlcov
